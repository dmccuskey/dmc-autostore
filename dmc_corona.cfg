[DMC_CORONA]

--==================================================--
-- option LUA_PATH, json
--
-- The folders which hold the DMC libraries, relative to
-- the project root. See dmc-corona-boot's documentation:
-- https://github.com/dmccuskey/dmc-corona-boot/blob/master/docs/configuration.md

LUA_PATH:JSON = [ "./dmc_corona" ]



[DMC_AUTOSTORE]

--==================================================--
-- option TIMER_MIN, milliseconds
--
-- Data is saved this long after the last change.
-- Each change restarts this timer.
--
-- default value is 1000

TIMER_MIN:INT = 1000


--==================================================--
-- option TIMER_MAX, milliseconds
--
-- Data is saved at most this long after the first
-- unsaved change, even while changes keep coming.
-- Must be greater than TIMER_MIN.
--
-- default value is 4000

TIMER_MAX:INT = 4000


--==================================================--
-- option DATA_FILENAME, string
--
-- The name of the data file in system.DocumentsDirectory.
-- '.json' is appended.
--
-- default value is dmc_autostore

-- DATA_FILENAME = dmc_autostore


--==================================================--
-- option PLUGIN_FILE, string
--
-- A module to require (a dotted name, from the project
-- root) which returns a table with preSaveFunction()
-- and/or postReadFunction(), eg to encode the file.
--
-- default is no plugin

-- PLUGIN_FILE = dmc_autostore_plugins
